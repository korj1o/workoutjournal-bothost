<body>
<div id="app">
  <header class="top"><div class="brand-row"><div class="brand"><span class="brand-symbol" id="brandIcon"></span>WorkoutJournal</div><button class="theme-button" id="themeToggle" aria-label="Переключить тему"></button></div><div class="eyebrow">ЛИЧНЫЙ ДНЕВНИК</div><h1 id="title">Тренировка</h1><div class="subhead" id="subtitle">Сохраняй занятия и следи за прогрессом</div></header>
  <main class="content" id="screen"><div class="loader">Загружаю дневник…</div></main>
  <nav class="bottom-nav"><div class="nav-inner">
    <button class="tab active" data-tab="record"><span>＋</span>Запись</button>
    <button class="tab" data-tab="programs"><span>▣</span>Программы</button>
    <button class="tab" data-tab="history"><span>▤</span>История</button>
    <button class="tab" data-tab="profile"><span>◉</span>Профиль</button>
    <button class="tab" data-tab="more"><span>⋯</span>Ещё</button>
  </div></nav>
</div>
<div class="more-drawer-backdrop" id="moreDrawer"><div class="more-drawer"><div class="more-drawer-handle"></div><div class="more-drawer-title">Дополнительные разделы</div><div class="more-drawer-grid"><button class="more-drawer-item" data-more-anchor="calendarSection"><span>▦</span>Календарь<small>Дни тренировок</small></button><button class="more-drawer-item" data-more-anchor="recordsSection"><span>★</span>Личные рекорды<small>Вес и повторы</small></button><button class="more-drawer-item" data-more-anchor="goalsSection"><span>⌁</span>Цели<small>План и прогресс</small></button></div></div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(() => {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const localDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const state = {meta:null, data:null, tab:"record", category:"Грудь", cardio:false, sets:[], selectedExercise:"", weightPeriod:"month", newProgramId:"", viewProgramId:"", programDraft:[], templateSets:3, moreMonth:new Date(), moreSection:"calendarSection"};
  const $ = (selector, root=document) => root.querySelector(selector);
  const screen = $("#screen");
  const iconPaths = {
    record:'<path d="m6 6 12 12M4 9l5-5M2 7l5-5m8 18 5-5m-3 7 5-5M7 10l3-3m4 10 3-3"/>',
    programs:'<rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h3"/>',
    history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
    more:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h1m6 0h1m-8 3h1"/>',
    trophy:'<path d="M8 3h8v6a4 4 0 0 1-8 0V3Zm0 2H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4m-4 1v5m-4 3h8m-8 0v-3h8v3"/>',
    target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    moon:'<path d="M20.5 13a8.5 8.5 0 0 1-9.5-9.5A8.5 8.5 0 1 0 20.5 13Z"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
    arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>'
  };
  const icon = name => `<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]||iconPaths.record}</svg>`;
  function applyTheme(theme){
    document.documentElement.dataset.theme=theme;
    const dark=theme==="dark";
    $("#themeToggle").innerHTML=icon(dark?"sun":"moon");
    $("#themeToggle").setAttribute("aria-label",dark?"Включить светлую тему":"Включить тёмную тему");
    document.querySelector('meta[name="theme-color"]').content=dark?"#111a17":"#f3f5f2";
    try{tg?.setHeaderColor(dark?"#111a17":"#f3f5f2");tg?.setBackgroundColor(dark?"#111a17":"#f3f5f2");}catch(_){}
  }
  let savedTheme;try{savedTheme=localStorage.getItem("workoutjournal.theme");}catch(_){}
  applyTheme(["dark","light"].includes(savedTheme)?savedTheme:(tg?.colorScheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")));
  $("#themeToggle").onclick=()=>{const theme=document.documentElement.dataset.theme==="dark"?"light":"dark";applyTheme(theme);try{localStorage.setItem("workoutjournal.theme",theme);}catch(_){}};
  $("#brandIcon").innerHTML=icon("record");
  document.querySelectorAll(".tab").forEach(button=>button.querySelector("span").innerHTML=icon(button.dataset.tab));
  const drawerIcons={calendarSection:"calendar",recordsSection:"trophy",goalsSection:"target"};
  document.querySelectorAll("[data-more-anchor]").forEach(button=>button.querySelector("span").innerHTML=icon(drawerIcons[button.dataset.moreAnchor]));
  const localDev = false;
  const fmtTime = d => `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  function headers(json=false) {
    const h = {};
    if (json) h["Content-Type"] = "application/json";
    if (tg?.initData) h["X-Telegram-Init-Data"] = tg.initData;
    else if (localDev && state.meta?.dev_mode) h["X-Dev-User-Id"] = "1";
    return h;
  }
  async function api(path, options={}) {
    const request = {...options, headers: {...headers(Boolean(options.body)), ...(options.headers || {})}};
    const result = await fetch(path, request);
    let response;
    try { response = await result.json(); }
    catch (_) { throw new Error(`Сервер вернул некорректный ответ (${result.status}).`); }
    if (!result.ok) throw new Error(response.error || "Не удалось выполнить запрос.");
    return response;
  }  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
  let drafts={entries:{}}, draftStorageKey="", draftStorageOK=true;
  const draftEntryKey=()=>JSON.stringify([state.cardio?"Кардио":state.category,state.selectedExercise]);
  function loadDrafts(){
    const userId=state.data.user?.id;
    draftStorageKey=userId?`workoutjournal.draft.v1.${userId}`:"";
    try{const saved=JSON.parse(localStorage.getItem(draftStorageKey)||"null");if(saved&&saved.version===1&&saved.entries&&typeof saved.entries==="object")drafts=saved;}
    catch(_){draftStorageOK=false;}
    if(!draftStorageKey)draftStorageOK=false;
    syncDraftSession();
    if(drafts.selected&&Object.hasOwn(state.data.exercises,drafts.selected.category)){state.category=drafts.selected.category;state.cardio=state.category==="Кардио";state.selectedExercise=String(drafts.selected.exercise||"");}
  }
  function draftStatus(){const el=$("#draftStatus");if(el)el.textContent=draftStorageOK?"Черновик сохраняется на этом устройстве":"Не удалось сохранить черновик на устройстве. Не закрывай приложение до добавления упражнения.";}
  function writeDrafts(){
    try{if(!draftStorageKey)throw new Error("Missing account");localStorage.setItem(draftStorageKey,JSON.stringify({...drafts,version:1}));draftStorageOK=true;}
    catch(_){draftStorageOK=false;}
    draftStatus();
  }
  function syncDraftSession(){
    const session=state.data.active_session;
    const id=session?String(session.id):null;
    if(drafts.sessionId!==id){drafts={version:1,sessionId:id,entries:{},start:session?null:drafts.start};state.sets=[];state.selectedExercise="";writeDrafts();}
  }
  function saveExerciseDraft(){
    if(!state.data?.active_session||!state.selectedExercise)return;
    drafts.selected={category:state.cardio?"Кардио":state.category,exercise:state.selectedExercise};
    drafts.entries[draftEntryKey()]={sets:state.sets.map(s=>({...s})),duration:$("#duration")?.value||"",distance:$("#distance")?.value||""};
    writeDrafts();
  }
  function previousExercise(){
    const current=state.data.active_session;if(!current||state.cardio)return null;
    const cleanName=value=>String(value||"").replace(/^(Грудь|Ноги|Спина|Другое|Кардио):\s*/,"").trim();
    const start=`${current.date}T${current.session_start||"00:00"}`;
    const candidates=(state.data.history||[]).filter(item=>String(item.session_id)!==String(current.id)&&!String(item.exercise).startsWith("Кардио:")&&cleanName(item.exercise)===state.selectedExercise&&`${item.date}T${item.session_start||"00:00"}`<start)
      .sort((a,b)=>b.date.localeCompare(a.date)||String(b.session_start||"").localeCompare(String(a.session_start||""))||b.id-a.id);
    for(const item of candidates){
      const sets=item.sets?.length?item.sets:Array.from({length:Math.min(100,Number(item.set_count)||0)},()=>({weight:item.weight,reps:item.reps}));

    const latest=all.length?new Date(all[all.length-1].date+"T12:00:00"):new Date();
    const from=new Date(latest);from.setDate(from.getDate()-windowDays+1);
    const readings=all.filter(item=>{const d=new Date(item.date+"T12:00:00");return d>=from&&d<=latest;});
    const period=`<div class="period-switch">${[["week","Неделя"],["month","Месяц"],["year","Год"]].map(([key,label])=>`<button data-period="${key}" class="${state.weightPeriod===key?"active":""}">${label}</button>`).join("")}</div>`;
    if(!readings.length)return `<div class="card"><div class="section-title">Динамика веса</div>${period}<p class="help">За этот период пока нет записей веса.</p></div>`;
    const values=readings.map(item=>Number(item.weight)), min=Math.min(...values), max=Math.max(...values);
    const spread=Math.max(max-min,1), low=min-spread*.25, high=max+spread*.25;
    const x=i=>readings.length===1?180:36+i*290/(readings.length-1);
    const y=value=>120-(value-low)*96/(high-low);
    const points=readings.map((item,i)=>`${x(i).toFixed(1)},${y(values[i]).toFixed(1)}`).join(" ");
    const dots=readings.map((item,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(values[i]).toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--paper)" stroke-width="2"><title>${esc(new Date(item.date+"T12:00:00").toLocaleDateString("ru-RU"))}: ${esc(item.weight)} кг</title></circle>`).join("");
    const delta=values[values.length-1]-values[0], days=`${readings.length} ${plural(readings.length,["тренировочный день","тренировочных дня","тренировочных дней"])}`;
    const change=readings.length>1?`Изменение за ${days}: <strong>${delta>0?"+":delta<0?"−":""}${Math.abs(delta).toLocaleString("ru-RU",{maximumFractionDigits:1})} кг</strong>`:"Первая отметка веса";
    const dateLabel=day=>new Date(day+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
    return `<div class="card"><div class="section-title">Динамика веса</div>${period}<p class="weight-trend">${change}</p><svg class="weight-chart" viewBox="0 0 340 140" role="img" aria-label="График веса по тренировочным дням"><line x1="36" y1="24" x2="326" y2="24" stroke="var(--line)"/><line x1="36" y1="120" x2="326" y2="120" stroke="var(--line)"/><text x="1" y="28" fill="var(--muted)" font-size="10">${max.toFixed(1)}</text><text x="1" y="124" fill="var(--muted)" font-size="10">${min.toFixed(1)}</text>${readings.length>1?`<polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:""}${dots}</svg><div class="weight-chart-labels"><span>${dateLabel(readings[0].date)}</span><span>${readings.length>1?dateLabel(readings[readings.length-1].date):""}</span></div><p class="help">${days} с отметками веса.</p></div>`;
  }
  function renderProfile(){
    const profile=state.data.profile||{};const weight=Number(profile.body_weight||0),height=Number(profile.height||0),bmi=weight&&height?weight/(height/100)**2:null;
    const caption=!bmi?"Укажи рост и вес в профиле":bmi<18.5?"Ниже стандартного диапазона":bmi<25?"Стандартный диапазон":bmi<30?"Выше стандартного диапазона":"Значительно выше стандартного диапазона";
    const marker=bmi?Math.min(98,Math.max(2,(bmi/40)*100)):0;
    $("#title").textContent="Профиль";$("#subtitle").textContent="Личные данные и текущий показатель ИМТ";
    screen.innerHTML=`<div class="card profile-card"><div class="avatar">${esc((profile.name||"Т").slice(0,1).toUpperCase())}</div><div><div class="workout-name">${esc(profile.name||"Заполни профиль")}</div><div class="workout-meta">${esc(profile.gender||"Пол не выбран")}</div></div></div>
      ${renderWeightChart()}
      <div class="card"><div class="section-title">Текущий ИМТ</div><div class="metric-grid"><div class="metric"><small>ИНДЕКС</small><strong>${bmi?bmi.toFixed(1):"—"}</strong><span>${caption}</span></div><div class="metric"><small>ВЕС / РОСТ</small><strong>${weight||"—"}<span> кг</span></strong><span>${height||"—"} см</span></div></div><div class="bmi-scale"><i class="bmi-marker" style="left:calc(${marker}% - 6px)"></i></div><p class="help">ИМТ — ориентировочный показатель для взрослых: меньше 18,5 — ниже стандартного диапазона, 18,5–24,9 — стандартный, 25–29,9 — повышенный, 30 и выше — высокий. Это не диагноз: ИМТ не различает мышечную и жировую массу и может завышать оценку у людей с большой мышечной массой.</p><button class="link-btn" id="moreBmi">Подробнее об ИМТ</button></div>
      <div class="card"><div class="section-title">Мои данные</div><div class="field"><label>Имя</label><input id="profile_name" maxlength="60" value="${esc(profile.name||"")}" placeholder="Имя" required></div><div class="field"><label>Пол</label><select id="profile_gender"><option value="">Выбери</option>${["Мужской","Женский","Другой"].map(x=>`<option ${profile.gender===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="row"><div class="field"><label>Вес · кг</label><input id="profile_weight" type="number" inputmode="decimal" min="0.1" max="1000" step="0.1" value="${esc(profile.body_weight||"")}" required></div><div class="field"><label>Рост · см</label><input id="profile_height" type="number" inputmode="decimal" min="80" max="250" step="0.1" value="${esc(profile.height||"")}" required></div></div><div class="section-title">Измерения тела · см</div><div class="row"><div class="field"><label>Грудь</label><input id="measure_chest" type="number" min="1" max="300" step="0.1" value="${esc(profile.measurements?.chest??"")}"></div><div class="field"><label>Талия</label><input id="measure_waist" type="number" min="1" max="300" step="0.1" value="${esc(profile.measurements?.waist??"")}"></div><div class="field"><label>Бицепс</label><input id="measure_biceps" type="number" min="1" max="300" step="0.1" value="${esc(profile.measurements?.biceps??"")}"></div><div class="field"><label>Бедро</label><input id="measure_thigh" type="number" min="1" max="300" step="0.1" value="${esc(profile.measurements?.thigh??"")}"></div></div><div id="message" class="notice"></div><button class="primary" id="saveProfile">Сохранить профиль</button></div>`;
    screen.querySelectorAll("[data-period]").forEach(button=>button.onclick=()=>{state.weightPeriod=button.dataset.period;renderProfile();});
    $("#moreBmi").onclick=()=>alert("ИМТ = вес в килограммах / (рост в метрах)². Для взрослых: ниже 18,5 — недостаточная масса; 18,5–24,9 — стандартный диапазон; 25–29,9 — повышенный; 30 и выше — высокий. ИМТ не учитывает состав тела и сам по себе не является медицинским диагнозом.");
    $("#saveProfile").onclick=async()=>{try{const data={name:$("#profile_name").value,gender:$("#profile_gender").value,body_weight:$("#profile_weight").value,height:$("#profile_height").value,chest:$("#measure_chest").value,waist:$("#measure_waist").value,biceps:$("#measure_biceps").value,thigh:$("#measure_thigh").value};const result=await api("/api/profile",{method:"POST",body:JSON.stringify(data)});state.data.profile=result.profile;renderProfile();}catch(e){showMessage(e.message,true);}};
  }
  function renderPrograms(){
    const programs=state.data.programs||[];
    $("#title").textContent="Программы тренировок";$("#subtitle").textContent="Сохраняй планы и сравнивай результаты";
    screen.innerHTML=`<div class="card"><div class="section-title">Мои программы</div><p class="help">Собери упражнения один раз. При старте тренировки выбери программу — список упражнений будет под рукой.</p><button class="primary" id="newProgram">＋ Создать программу</button></div>${programs.length?programs.map(p=>{
      const previous=(state.data.sessions||[]).filter(s=>String(s.program_id)===String(p.id)&&s.session_end).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)[0];
      const expanded=state.viewProgramId===String(p.id);const previousItems=previous?(state.data.history||[]).filter(item=>item.session_id===previous.id):[];
      const date=previous?new Date(previous.date+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}):"";
      return `<div class="card"><div class="section-title">${esc(p.name)}</div><div class="help">${p.exercises.length} ${plural(p.exercises.length,["упражнение","упражнения","упражнений"])}</div>${p.exercises.map(item=>`<div class="program-exercise"><span>${esc(item.exercise)}<small>${esc(item.category)}${item.category==="Кардио"?"":` · ${item.sets} подхода`}</small></span></div>`).join("")}<div class="program-actions"><button class="primary" data-start-program="${esc(p.id)}">Начать по программе</button><button class="secondary" data-prev-program="${esc(p.id)}">${previous?(expanded?"Скрыть прошлую":"Прошлая тренировка"):"Истории пока нет"}</button></div><div class="program-actions"><button class="secondary" data-edit-program="${esc(p.id)}">Изменить</button><button class="secondary" data-delete-program="${esc(p.id)}">Удалить</button></div>${expanded&&previous?`<div class="history-session"><div class="workout-meta">${date} · ${esc(previous.session_start)}–${esc(previous.session_end)} · вес тела ${esc(previous.body_weight)} кг</div>${previousItems.length?previousItems.map(historyCard).join(""):'<p class="help">В этой тренировке нет сохранённых упражнений.</p>'}</div>`:""}</div>`;
    }).join(""):'<div class="card empty">Пока нет программ. Создай план под свою тренировку.</div>'}`;
    $("#newProgram").onclick=()=>openProgramEditor();
    screen.querySelectorAll("[data-prev-program]").forEach(button=>button.onclick=()=>{const id=String(button.dataset.prevProgram);state.viewProgramId=state.viewProgramId===id?"":id;renderPrograms();});
    screen.querySelectorAll("[data-edit-program]").forEach(button=>button.onclick=()=>openProgramEditor(programs.find(p=>String(p.id)===button.dataset.editProgram)));
    screen.querySelectorAll("[data-delete-program]").forEach(button=>button.onclick=async()=>{const p=programs.find(x=>String(x.id)===button.dataset.deleteProgram);if(!p||!confirm(`Удалить программу «${p.name}»?`))return;try{await api(`/api/programs/${p.id}`,{method:"DELETE"});state.data=await api("/api/bootstrap");renderPrograms();}catch(e){alert(e.message);}});
    screen.querySelectorAll("[data-start-program]").forEach(button=>button.onclick=()=>{state.newProgramId=String(button.dataset.startProgram);state.tab="record";render();window.scrollTo({top:0,behavior:"smooth"});});
  }
  function openProgramEditor(program=null){
    const categories=["Грудь","Ноги","Спина","Другое","Кардио"];
    const draft=(program?.exercises||[]).map(x=>({...x}));
    const layer=document.createElement("div");layer.className="edit-overlay";
    layer.innerHTML=`<form class="edit-modal"><div class="modal-heading"><h2>${program?"Изменить программу":"Новая программа"}</h2><button type="button" class="icon-btn" data-close>×</button></div><label>Название программы<input name="name" maxlength="80" required value="${esc(program?.name||"")}" placeholder="Например, Верх тела"></label><label>Группа мышц / вид<select name="category">${categories.map(x=>`<option>${x}</option>`).join("")}</select></label><label>Упражнение<select name="exercise"></select></label><div class="row"><label>Подходы<input name="sets" type="number" min="1" max="100" value="3"></label><button type="button" class="secondary" data-add style="align-self:end;margin-bottom:12px">Добавить упражнение</button></div><div data-list></div><div class="edit-error" data-error></div><div class="modal-actions"><button type="button" class="secondary" data-cancel>Отмена</button><button class="primary" type="submit" style="width:auto">Сохранить</button></div></form>`;
    document.body.append(layer);const form=layer.querySelector("form"),category=form.elements.category,exercise=form.elements.exercise,list=layer.querySelector("[data-list]");
    const fillExercises=()=>{const choices=state.data.exercises[category.value]||[];exercise.innerHTML=choices.map(x=>`<option>${esc(x)}</option>`).join("");};
    const renderDraft=()=>{list.innerHTML=draft.map((item,i)=>`<div class="program-exercise"><span>${esc(item.exercise)}<small>${esc(item.category)}${item.category==="Кардио"?"":` · ${item.sets} подхода`}</small></span><button type="button" class="icon-btn" data-remove="${i}">×</button></div>`).join("");list.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{draft.splice(Number(b.dataset.remove),1);renderDraft();});};
    fillExercises();category.onchange=fillExercises;renderDraft();
    const close=()=>layer.remove();layer.querySelector("[data-close]").onclick=close;layer.querySelector("[data-cancel]").onclick=close;layer.onclick=e=>{if(e.target===layer)close();};
    layer.querySelector("[data-add]").onclick=()=>{if(!exercise.value)return;draft.push({category:category.value,exercise:exercise.value,sets:category.value==="Кардио"?1:Number(form.elements.sets.value||3)});renderDraft();};
    form.onsubmit=async e=>{e.preventDefault();const error=layer.querySelector("[data-error]");if(!draft.length){error.textContent="Добавь хотя бы одно упражнение.";return;}try{const payload={name:form.elements.name.value,exercises:draft};await api(program?`/api/programs/${program.id}`:"/api/programs",{method:program?"PUT":"POST",body:JSON.stringify(payload)});state.data=await api("/api/bootstrap");close();renderPrograms();}catch(err){error.textContent=err.message;}};
  }
  function renderMore(){
    const sectionTitles={calendarSection:"Календарь тренировок",recordsSection:"Личные рекорды",goalsSection:"Цели"};
    $("#title").textContent=sectionTitles[state.moreSection]||"Ещё";$("#subtitle").textContent="Дополнительный раздел";
    const month=new Date(state.moreMonth.getFullYear(),state.moreMonth.getMonth(),1), year=month.getFullYear(), monthIndex=month.getMonth();
    const firstDay=(month.getDay()+6)%7, daysInMonth=new Date(year,monthIndex+1,0).getDate();
    const trained=new Set(state.data.calendar_days||[]), today=localDate(new Date());
    let calendar=[...Array(firstDay)].map(()=>`<i></i>`).join("");
    for(let day=1;day<=daysInMonth;day++){const key=`${year}-${String(monthIndex+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;calendar+=`<button class="${trained.has(key)?"trained ":""}${key===today?"today":""}" data-calendar-day="${key}">${day}</button>`;}
    const records=state.data.records||[];
    const exerciseNames=[...new Set(records.map(x=>x.exercise).concat(Object.values(state.data.exercises||{}).flat()))].sort((a,b)=>a.localeCompare(b,"ru"));
    const goals=state.data.goals||{}, completed=(state.data.sessions||[]).filter(s=>s.session_end).length||new Set((state.data.calendar_days||[])).size;
    const profile=state.data.profile||{}, currentWeight=Number(profile.body_weight||0), targetWeight=Number(goals.target_weight||0), targetWorkouts=Number(goals.target_workouts||0), targetRecord=Number(goals.target_record||0), selectedRecord=records.find(x=>x.exercise===goals.target_exercise), currentRecord=selectedRecord?.max_weight||0;
    const progress=(value,target)=>target?Math.min(100,Math.max(0,value/target*100)):0;
    screen.innerHTML=`<div class="card" id="calendarSection"><div class="modal-heading"><div class="section-title">Календарь тренировок</div><div><button class="icon-btn" id="prevMonth">‹</button><button class="icon-btn" id="nextMonth">›</button></div></div><h2 style="font-size:18px;margin:0 0 10px;text-transform:capitalize">${month.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})}</h2><div class="calendar-grid"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>${calendar}</div><p class="help" style="margin-bottom:0">Отмечены дни, в которые есть сохранённая тренировка.</p></div>
      <div class="card" id="recordsSection"><div class="section-title">Личные рекорды</div>${records.length?records.map(item=>`<div class="program-exercise"><span>${esc(item.exercise)}<small>${item.weight_date?`Лучший вес · ${new Date(item.weight_date+"T12:00:00").toLocaleDateString("ru-RU")}`:""}</small></span><div class="record-card"><div class="record-metric"><small>Вес</small><strong>${item.max_weight.toLocaleString("ru-RU")} кг</strong></div><div class="record-metric"><small>Повторы</small><strong>${item.max_reps}</strong></div></div></div>`).join(""):'<p class="help">Рекорды появятся после сохранения силовых упражнений.</p>'}</div>
      <div class="card" id="goalsSection"><div class="section-title">Цели</div><div class="field"><label>Целевой вес · кг</label><input id="goal_weight" type="number" min="1" max="1000" step="0.1" value="${esc(goals.target_weight??"")}" placeholder="Например, 80"></div><div class="field"><label>Тренировок всего</label><input id="goal_workouts" type="number" min="1" max="10000" step="1" value="${esc(goals.target_workouts??"")}" placeholder="Например, 50"></div><div class="field"><label>Рекорд в упражнении</label><select id="goal_exercise"><option value="">Не задано</option>${exerciseNames.map(name=>`<option ${name===goals.target_exercise?"selected":""}>${esc(name)}</option>`).join("")}</select></div><div class="field"><label>Целевой вес в этом упражнении · кг</label><input id="goal_record" type="number" min="1" max="10000" step="0.1" value="${esc(goals.target_record??"")}" placeholder="Например, 100"></div><div class="goal-row"><strong>Вес: ${currentWeight||"—"} ${targetWeight?`/ ${targetWeight} кг`:""}</strong>${targetWeight?`<div class="goal-progress"><i style="width:${progress(currentWeight,targetWeight)}%"></i></div>`:""}</div><div class="goal-row"><strong>Тренировки: ${completed}${targetWorkouts?` / ${targetWorkouts}`:""}</strong>${targetWorkouts?`<div class="goal-progress"><i style="width:${progress(completed,targetWorkouts)}%"></i></div>`:""}</div><div class="goal-row"><strong>Рекорд: ${currentRecord||"—"} ${targetRecord?`/ ${targetRecord} кг`:""}</strong>${targetRecord?`<div class="goal-progress"><i style="width:${progress(currentRecord,targetRecord)}%"></i></div>`:""}</div><div id="message" class="notice"></div><button class="primary" id="saveGoals">Сохранить цели</button></div>`;
    ["calendarSection","recordsSection","goalsSection"].forEach(id=>{const element=document.getElementById(id);if(element&&id!==state.moreSection)element.classList.add("hidden");});
    $("#prevMonth").onclick=()=>{state.moreMonth=new Date(year,monthIndex-1,1);renderMore();};$("#nextMonth").onclick=()=>{state.moreMonth=new Date(year,monthIndex+1,1);renderMore();};
    screen.querySelectorAll("[data-calendar-day]").forEach(button=>button.onclick=()=>{state.tab="history";renderHistory();});
    $("#saveGoals").onclick=async()=>{try{const result=await api("/api/goals",{method:"POST",body:JSON.stringify({target_weight:$("#goal_weight").value,target_workouts:$("#goal_workouts").value,target_exercise:$("#goal_exercise").value,target_record:$("#goal_record").value})});state.data.goals=result.goals;renderMore();}catch(e){showMessage(e.message,true);}};
  }
  const moreDrawer=$("#moreDrawer");
  const drawerPanel=moreDrawer.querySelector(".more-drawer");
  drawerPanel.setAttribute("role","dialog");drawerPanel.setAttribute("aria-modal","true");drawerPanel.setAttribute("aria-label","Ещё");
  const drawerClose=document.createElement("button");drawerClose.className="icon-btn drawer-close";drawerClose.textContent="×";drawerClose.setAttribute("aria-label","Закрыть меню");drawerPanel.querySelector(".more-drawer-title").prepend(drawerClose);
  moreDrawer.inert=true;
  function closeMoreDrawer(){moreDrawer.classList.remove("open");moreDrawer.inert=true;document.body.style.overflow="";document.querySelector('[data-tab="more"]').focus();}
  function openMoreDrawer(){moreDrawer.inert=false;moreDrawer.classList.add("open");document.body.style.overflow="hidden";drawerClose.focus();}
  drawerClose.onclick=closeMoreDrawer;
  moreDrawer.addEventListener("keydown",e=>{if(e.key==="Escape")closeMoreDrawer();if(e.key==="Tab"){const buttons=[...moreDrawer.querySelectorAll("button")];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus();}}});
  moreDrawer.onclick=e=>{if(e.target===moreDrawer)closeMoreDrawer();};
  moreDrawer.querySelectorAll("[data-more-anchor]").forEach(button=>button.onclick=async()=>{state.moreSection=button.dataset.moreAnchor;state.tab="more";closeMoreDrawer();try{state.data=await api("/api/bootstrap");}catch(e){screen.innerHTML=`<div class="card empty">${esc(e.message)}</div>`;return;}render();});
  function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));if(state.tab==="record")renderRecord();else if(state.tab==="history")renderHistory();else if(state.tab==="programs")renderPrograms();else if(state.tab==="more")renderMore();else renderProfile();}
  document.querySelectorAll(".tab").forEach(b=>b.onclick=async()=>{if(b.dataset.tab==="more"){openMoreDrawer();return;}state.tab=b.dataset.tab;if(state.tab!=="record")try{state.data=await api("/api/bootstrap");}catch(e){screen.innerHTML=`<div class="card empty">${esc(e.message)}</div>`;return;}render();});
  async function start(){
    try{state.meta=await api("/api/meta");if(!state.meta.configured)throw new Error("Сервер Mini App пока не настроен.");
      state.data=await api("/api/bootstrap");
      loadDrafts();
      if(!state.data.profile?.name)state.tab="profile";
      render();
    }catch(error){screen.innerHTML=`<div class="card"><div class="section-title">Не удалось открыть дневник</div><div class="help">${esc(error.message)}${!tg&&!localDev?" Открой приложение через Telegram.":""}</div></div>`;}
  }
  start();
})();
</script>
</body>
